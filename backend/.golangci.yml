version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
  settings:
    staticcheck:
      checks:
        - all
        # Route-first doc comments (e.g. "// GET /api/...") document the HTTP
        # surface; method-name prefixes would bury that signal.
        - -ST1020
        - -QF1008
formatters:
  enable:
    - gofumpt
    - goimports
