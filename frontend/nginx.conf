server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # SPA fallback: no TanStack router, hash-based svelte-spa-router needs only index.html
  location / {
    try_files $uri /index.html;
  }
  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
